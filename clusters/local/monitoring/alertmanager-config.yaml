apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord-webhook
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - namespace
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    # Platform-level alerts (Kubernetes cluster + ShopHub) carry a team label.
    # Per-shop alerts carry a `shop` label instead and are routed to that shop's
    # own Discord channel by the operator-generated AlertmanagerConfig, so they
    # are intentionally excluded here.
    matchers:
      - name: team
        matchType: "=~"
        value: "platform|shophub"
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            key: webhook-url
            name: alertmanager-discord-secret
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          message: >-
            {{ range .Alerts }}
            **Alert:** {{ .Annotations.summary }}
            **Severity:** {{ .Labels.severity }}
            **Description:** {{ .Annotations.description }}
            {{ end }}
