# Scrapes every Shop instance created by the shop-operator.
# Shop pods carry the label app.kubernetes.io/name=shop and expose
# the named container port "http" (8080) at /metrics.
# A single cluster-wide PodMonitor covers all shops, so newly created
# shops become observable automatically.
#
# Each shop's metrics are tagged with a `shop` label (copied from the pod's
# app.kubernetes.io/instance label) so per-shop dashboards and alerts can
# filter to a single store. The operator-generated PrometheusRules and Grafana
# dashboards rely on this label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shop-instances
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        # Expose the shop instance name as a stable `shop` label.
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
          targetLabel: shop
        # Keep the pod's namespace as `shop_namespace` for clarity in dashboards.
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: shop_namespace
