image:
  repository: milos2002/shophub
  tag: development
  pullPolicy: Always

replicaCount: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: shophub.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

hpa:
  enabled: false

config:
  httpPort: "8080"
  jwtSecret: "change-me-before-deploy"
  kubeconfig: ""

# ShopHub's own PostgreSQL runs through the CloudNativePG operator (§1.2
# napomena: baze se deployuju preko svojih operatora) — the chart renders a
# postgresql.cnpg.io/v1 Cluster and the app reads credentials from the
# CNPG-generated Secret shophub-db-app. No database password lives in git.
database:
  cnpg:
    enabled: true
    clusterName: shophub-db
    instances: 1
    storageSize: 1Gi
    databaseName: shophub_db
    owner: shophub_user

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
