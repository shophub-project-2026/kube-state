image:
  repository: milos2002/shop-operator
  tag: development
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

# Per-shop Discord channels (spec §3.1/§4.1). Set guildId to your Discord
# server (guild) ID and apply shop-operator-discord-secret.yaml in this folder
# with a real bot token. With both set, the operator creates a dedicated
# channel + webhook for every shop. Leave guildId empty to keep the operator
# running with only the manual webhookUrl override.
discord:
  guildId: "1509899947179511900"
  botToken:
    secretName: shop-operator-discord-bot
    secretKey: bot-token
