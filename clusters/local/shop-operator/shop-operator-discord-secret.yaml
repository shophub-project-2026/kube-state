# Bot token for the shop-operator's DiscordChannel controller. The operator
# uses it to create a dedicated channel + webhook per shop (spec §3.1/§4.1).
#
# The bot must be invited to the guild (DISCORD_GUILD_ID in values.yaml) with
# the Manage Channels and Manage Webhooks permissions.
#
# Do NOT commit a real token. Replace the placeholder locally, e.g.:
#   kubectl create secret generic shop-operator-discord-bot \
#     -n shop-operator --from-literal=bot-token='<YOUR_BOT_TOKEN>'
apiVersion: v1
kind: Secret
metadata:
  name: shop-operator-discord-bot
  namespace: shop-operator
type: Opaque
stringData:
  bot-token: "REPLACE_WITH_DISCORD_BOT_TOKEN"
