# This directory tracks the platform-level Discord integration for ShopHub
# and cluster alerts. The alertmanager-discord-secret (platform webhook URL)
# is provisioned out-of-band via pokretanje.ps1 and stored in the
# monitoring namespace. See clusters/local/monitoring/alertmanager-discord-secret.yaml
# for the placeholder and clusters/local/monitoring/alertmanager-config.yaml
# for the routing configuration.
