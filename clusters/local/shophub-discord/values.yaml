# Value overrides for the shophub-discord chart (platform Discord routing).
#
# The webhook URL is a credential and is never committed: discord.webhookUrl
# stays empty and the Secret alertmanager-discord-secret is provisioned
# out-of-band by pokretanje.ps1 (interactive prompt on first run):
#   kubectl create secret generic alertmanager-discord-secret -n monitoring \
#     --from-literal=webhook-url='<discord-webhook-url>'
discord:
  webhookUrl: ""
  secret:
    name: alertmanager-discord-secret
    key: webhook-url

# Platform alerts only; per-shop alerts (label shop=<name>) are routed by the
# shop-operator's per-shop AlertmanagerConfig to the shop's own channel.
route:
  matchers:
    - name: team
      matchType: "=~"
      value: "platform|shophub"
  repeatInterval: 12h

alertmanagerConfigLabels:
  release: kube-prometheus-stack
