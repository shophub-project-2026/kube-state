# Platform Discord integration for ShopHub and cluster-level alerts.
#
# The platform webhook URL is stored in the Secret alertmanager-discord-secret
# in the monitoring namespace (never committed to git). This Secret is
# referenced by the AlertmanagerConfig in clusters/local/monitoring/alertmanager-config.yaml
# which routes alerts with team=platform or team=shophub labels to Discord.
#
# To provision the secret:
#   kubectl create secret generic alertmanager-discord-secret -n monitoring \
#     --from-literal=webhook-url='<your-discord-webhook-url>'
#
# A placeholder with an empty URL is applied by pokretanje.ps1 if the secret
# is not present (see clusters/local/monitoring/alertmanager-discord-secret.yaml).
discord:
  alertmanager:
    secretName: alertmanager-discord-secret
    secretKey: webhook-url
    namespace: monitoring
