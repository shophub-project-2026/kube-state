name: CI

on:
  pull_request:
    branches:
      - main
      - development

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Conventional Commits check
        uses: wagoid/commitlint-github-action@v5

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: |
          set -euo pipefail
          if [ -d clusters ]; then
            yamllint -c .yamllint.yml clusters/
          else
            echo "clusters/ directory does not exist yet -- skipping lint"
          fi
